<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141d13"><title>Renovator</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#223021;background:#f6f8f3}*{box-sizing:border-box}body{margin:0}header{background:#141d13;color:white;padding:22px max(15px,calc((100vw - 920px)/2))}h1{color:#b8ff24;margin:0;font-size:29px}header p{margin:4px 0 0}.wrap{max-width:920px;margin:auto;padding:16px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:#b8ff24;color:#16200e;font-weight:650;cursor:pointer}button.alt{background:#f4ffdf;border:1px solid #b5d98b;color:#36530e}nav button:not(.active){background:#e8f3d8}.card{background:white;border:1px solid #dbe5d5;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #00000009}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#61715f;font-size:14px}.small{font-size:13px}h2{font-size:21px;margin:16px 0 9px}h3{font-size:18px;margin:0 0 7px}p{line-height:1.5}.pill{font-size:12px;border-radius:20px;background:#e9ffc5;padding:5px 9px;color:#355300;font-weight:650}.bar{height:10px;background:#e4eeda;border-radius:10px;overflow:hidden;margin:12px 0}.bar div{height:100%;background:#b8ff24}.slots{display:grid;grid-template-columns:95px 1fr 52px;align-items:center;gap:8px;margin:9px 0;font-size:13px}.blocks{display:flex;gap:3px}.blocks span{height:17px;flex:1;background:#e5eddc;border-radius:3px}.blocks span.yes{background:#b8ff24}.notice{background:#f0ffda;border-left:4px solid #b8ff24;padding:12px;border-radius:9px}.hidden{display:none!important}label{display:block;font-weight:650;font-size:13px;margin:11px 0 5px}input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid #c4d3bb;border-radius:9px;background:white}textarea{min-height:70px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}details{margin-top:12px}summary{cursor:pointer;font-weight:650;color:#446c10}footer{text-align:center;padding:20px}footer button{font-size:12px;background:transparent;text-decoration:underline;color:#51664a;font-weight:400}dialog{border:1px solid #cbd9c1;border-radius:14px;max-width:min(440px,calc(100vw - 32px));padding:22px}dialog::backdrop{background:#0008}#toast{position:sticky;top:8px;z-index:10;background:#eaffc6;border:2px solid #79a42b;border-radius:10px;padding:12px;font-weight:700}button:focus-visible,input:focus-visible{outline:2px solid #507d00;outline-offset:2px}@media(max-width:540px){.wrap{padding:12px}.fields{grid-template-columns:1fr}.slots{grid-template-columns:75px 1fr 45px;gap:4px;font-size:11px}}
</style></head><body><header><h1>Renovator</h1><p>gemeinsam den Überblick behalten</p></header><main class="wrap"><div id="toast" role="status" class="hidden"></div><nav><button class="active" data-tab="tasks">Das ist zu tun</button><button data-tab="offers">Ich biete an</button><button data-tab="overview">Alle Zusagen</button><button data-tab="admin">Verwaltung</button></nav><div id="content"><p>Lade den aktuellen Helferplan …</p></div></main><footer><button onclick="document.getElementById('about').showModal()">Über diese App</button></footer><dialog id="about"><h2>Über diese App</h2><p>Diese App wurde von Stephan Moll mit Chatgpt erstellt. Verbesserungsvorschläge bitte an <a href="mailto:stefanmoll@aol.com">stefanmoll@aol.com</a></p><button onclick="document.getElementById('about').close()">Schließen</button></dialog><script>
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mins=s=>Number(s.slice(0,2))*60+Number(s.slice(3,5));const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;const dl=s=>new Date(s+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};let state={tasks:[],signups:[],offers:[]},tab='tasks',auth=sessionStorage.getItem('renovatorAuth')||'',role='';const edits=()=>{try{return JSON.parse(localStorage.getItem('renovatorEdits')||'{}')}catch{return {}}};function storeEdit(id,token){let x=edits();x[id]=token;localStorage.setItem('renovatorEdits',JSON.stringify(x))}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>$('toast').classList.add('hidden'),5500)}async function api(action,method='GET',body){const res=await fetch('/api?action='+action,{method,headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth}:{})},body:body?JSON.stringify(body):undefined});let d=await res.json();if(!res.ok)throw Error(d.error||'Verbindungsfehler');return d}async function load(){try{state=await api('list');role=state.role||'';render();formDirty=false}catch(e){$('content').innerHTML=`<div class="card"><h2>Verbindung fehlgeschlagen</h2><p>${esc(e.message)}</p><button onclick="load()">Erneut versuchen</button></div>`}}function show(t){formDirty=false;tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));function slots(t){let out=[];for(let m=mins(t.start_time);m<mins(t.end_time);m+=30){let n=Math.min(m+30,mins(t.end_time));out.push({from:m,to:n,have:state.signups.filter(s=>s.task_id===t.id&&mins(s.start_time)<n&&mins(s.end_time)>m).length})}return out}function renderTasks(){const days=[...new Set(state.tasks.map(t=>t.date))].sort();return `<h2>Das ist zu tun</h2><p class="muted">Wähle eine Arbeit und trage ein, wann du helfen kannst. Der Bedarf wird halbstündlich angezeigt.</p>${days.length?days.map(d=>`<h2>${esc(dl(d))}</h2>${state.tasks.filter(t=>t.date===d).map(t=>{let s=slots(t),total=s.reduce((a,b)=>a+b.have,0),need=s.length*t.need,short=s.some(x=>x.have<t.need);return `<article class="card"><div class="row"><h3>${esc(t.title)}</h3><span class="pill">${short?'Noch Hilfe nötig':'Durchgehend besetzt'}</span></div><div class="muted">${esc(t.start_time.slice(0,5))}–${esc(t.end_time.slice(0,5))} Uhr · ${t.need} Helfer gleichzeitig benötigt</div><p>${esc(t.description)}</p><div class="bar"><div style="width:${Math.min(100,Math.round(total/Math.max(1,need)*100))}%"></div></div><p class="small">${(total/2).toLocaleString('de-DE')} von ${(need/2).toLocaleString('de-DE')} Helferstunden zugesagt</p><details><summary>Besetzung im Tagesverlauf</summary>${s.map(x=>`<div class="slots"><span>${fmt(x.from)}–${fmt(x.to)}</span><div class="blocks">${Array.from({length:Math.max(x.have,t.need)},(_,i)=>`<span class="${i<x.have?'yes':''}"></span>`).join('')}</div><span>${x.have}/${t.need}</span></div>`).join('')}<p class="muted small">Neongrün = zugesagt · Leere Felder = Helfer fehlen</p></details><details><summary>Ich helfe mit</summary><form onsubmit="signup(event,'${t.id}')"><label>Dein Name</label><input name="name" maxlength="80" required><div class="fields"><div><label>Von</label><input name="start_time" type="time" value="${t.start_time.slice(0,5)}" min="${t.start_time.slice(0,5)}" max="${t.end_time.slice(0,5)}" step="1800" required></div><div><label>Bis</label><input name="end_time" type="time" value="${t.end_time.slice(0,5)}" min="${t.start_time.slice(0,5)}" max="${t.end_time.slice(0,5)}" step="1800" required></div></div><p><button>Verbindlich zusagen</button></p></form></details><details><summary>Bereits zugesagt (${state.signups.filter(x=>x.task_id===t.id).length})</summary>${state.signups.filter(x=>x.task_id===t.id).map(x=>`<p class="small">${esc(x.name)}: ${esc(x.start_time.slice(0,5))}–${esc(x.end_time.slice(0,5))} Uhr ${edits()[x.id]||role?`<button class="alt" onclick="removeEntry('signups','${x.id}')">Zurückziehen</button>`:''}</p>`).join('')||'<p>Noch niemand.</p>'}</details></article>`}).join('')}`).join(''):'<div class="card">Noch keine Arbeiten angelegt. Bitte zunächst in der Verwaltung einen Plan erstellen.</div>'}`}
function renderOffers(){let tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);return `<h2>Ich biete an</h2><p class="muted">Du kannst auch Unterstützung anbieten, die nicht im Arbeitsplan steht.</p><div class="card"><form onsubmit="addOffer(event)"><label>Dein Name</label><input name="name" maxlength="80" required><label>Art der Unterstützung</label><select name="kind"><option>Verpflegung</option><option>Transport und Besorgungen</option><option>Werkzeug und Material</option><option>Sonstige Hilfe</option></select><label>Was möchtest du anbieten?</label><input name="title" maxlength="140" placeholder="z. B. Suppe kochen" required><div class="fields"><div><label>Datum</label><input name="date" type="date" value="${iso(tomorrow)}" required></div><div><label>Uhrzeit (optional)</label><input name="time" type="time"></div></div><label>Weitere Hinweise (optional)</label><textarea name="description"></textarea><p><button>Angebot verbindlich eintragen</button></p></form></div><h2>Bisherige Angebote</h2>${state.offers.map(o=>`<div class="card"><div class="row"><h3>${esc(o.title)}</h3><span class="pill">${esc(o.kind)}</span></div><div class="muted">${esc(o.name)} · ${esc(dl(o.date))}${o.time?' · '+esc(o.time.slice(0,5))+' Uhr':''}</div><p>${esc(o.description)}</p>${edits()[o.id]||role?`<button class="alt" onclick="removeEntry('offers','${o.id}')">Angebot zurückziehen</button>`:''}</div>`).join('')||'<p>Noch keine Angebote.</p>'}`}
function renderOverview(){return `<h2>Alle Zusagen und Angebote</h2><div class="card"><h3>Helferzusagen</h3>${state.signups.map(s=>{let t=state.tasks.find(t=>t.id===s.task_id);return t?`<p>${esc(s.name)} · ${esc(dl(t.date))} · ${esc(t.title)} · ${esc(s.start_time.slice(0,5))}–${esc(s.end_time.slice(0,5))}</p>`:''}).join('')||'<p>Noch keine Zusagen.</p>'}</div><div class="card"><h3>Freiwillige Angebote</h3>${state.offers.map(o=>`<p>${esc(o.name)} · ${esc(dl(o.date))} · ${esc(o.title)}</p>`).join('')||'<p>Noch keine Angebote.</p>'}</div>`}
function renderAdmin(){if(!role)return `<h2>Verwaltung</h2><div class="card"><form onsubmit="login(event)"><label>Verwaltungspasswort</label><input type="password" name="password" autocomplete="current-password" required><p><button>Anmelden</button></p></form></div>`;let tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);return `<h2>Verwaltung</h2><div class="notice">Angemeldet als ${role==='admin'?'App-Administrator':'Verwaltung'}. <button class="alt" onclick="logout()">Abmelden</button></div><div class="card"><h3>Neue Arbeit anlegen</h3><form onsubmit="addTask(event)"><label>Tätigkeit</label><input name="title" maxlength="140" required><div class="fields"><div><label>Datum</label><input type="date" name="date" value="${iso(tomorrow)}" required></div><div><label>Benötigte Helfer gleichzeitig</label><input type="number" name="need" min="1" max="30" value="3" required></div><div><label>Von</label><input type="time" name="start_time" value="09:00" required></div><div><label>Bis</label><input type="time" name="end_time" value="17:00" required></div></div><label>Beschreibung und Hinweise</label><textarea name="description"></textarea><p><button>Arbeit hinzufügen</button></p></form></div><h3>Arbeiten verwalten</h3>${state.tasks.map(t=>`<div class="card row"><div><strong>${esc(t.title)}</strong><div class="muted">${esc(dl(t.date))} · ${esc(t.start_time.slice(0,5))}–${esc(t.end_time.slice(0,5))} · ${t.need} Helfer</div></div><button class="alt" onclick="removeTask('${t.id}')">Entfernen</button></div>`).join('')}`}
let formDirty=false;document.addEventListener('input',e=>{if(e.target.closest('#content form'))formDirty=true});document.addEventListener('change',e=>{if(e.target.closest('#content form'))formDirty=true});function render(){$('content').innerHTML=({tasks:renderTasks,offers:renderOffers,overview:renderOverview,admin:renderAdmin})[tab]()}async function act(action,method,body,success){try{const result=await api(action,method,body);if(result.editToken)storeEdit(result.id,result.editToken);await load();if(success)toast(success)}catch(e){alert(e.message)}}window.signup=async(e,task_id)=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(mins(f.start_time)>=mins(f.end_time))return alert('Endzeit muss nach Startzeit liegen.');await act('signup','POST',{...f,task_id},'Vielen Dank, ist notiert.')};window.addOffer=async e=>{e.preventDefault();await act('offer','POST',Object.fromEntries(new FormData(e.target)),'Vielen Dank, ist notiert.')};window.addTask=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(mins(f.start_time)>=mins(f.end_time))return alert('Endzeit muss nach Startzeit liegen.');await act('task','POST',f,'Arbeit wurde angelegt.')};window.login=async e=>{e.preventDefault();try{const d=await api('login','POST',{password:new FormData(e.target).get('password')});auth=d.token;sessionStorage.setItem('renovatorAuth',auth);await load();toast('Anmeldung erfolgreich.')}catch(err){alert(err.message)}};window.logout=()=>{auth='';role='';sessionStorage.removeItem('renovatorAuth');load()};window.removeTask=async id=>{if(confirm('Arbeit einschließlich aller Zusagen wirklich löschen?'))await act('task','DELETE',{id},'Arbeit entfernt.')};window.removeEntry=async(kind,id)=>{if(confirm('Eintrag wirklich zurückziehen?'))await act('entry','DELETE',{kind,id,editToken:edits()[id]},'Eintrag zurückgezogen.')};load();setInterval(()=>{if(document.hidden||formDirty||document.activeElement?.closest('#content form'))return;load()},30000);
</script></body></html>
